<div>
  <div
    class="is-flex is-flex-direction-row is-fullwidth is-justify-content-center my-4"
  >
    <p class="is-size-3 my-4" translate>digitalTwin.header.daySelection</p>
    <div
      class="is-flex is-flex-direction-column is-justify-content-center mx-4"
    >
      <input type="date" style="height: 2rem" />
    </div>
  </div>

  <hr />

  <chart
    header="digitalTwin.header.waterLevel"
    [chartData]="dataWaterLevel"
    text="m"
    [suggestedMax]="4"
    chartType="line"
  />

  <hr />

  <chart
    header="digitalTwin.header.inflow"
    [chartData]="dataDrainage"
    text="l/s"
    [suggestedMax]="100"
    chartType="line"
  />

  <hr />

  <chart
    header="digitalTwin.header.outflow"
    [chartData]="dataDrainage"
    text="l/s"
    [suggestedMax]="100"
    chartType="line"
  />

  <hr />

  <chart
    header="digitalTwin.label.rainAmount"
    [chartData]="dataRainForecast"
    text="mm"
    [suggestedMax]="25"
    chartType="bar"
  />
</div>
