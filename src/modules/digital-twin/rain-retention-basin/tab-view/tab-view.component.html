<div class="card is-fullheight" style="overflow: auto">
  <div class="card-content p-0">
    <div class="tabs is-fullwidth is-toggle">
      <ul>
        <li routerLinkActive="is-active">
          <a routerLink="overview" queryParamsHandling="preserve">
            <span class="icon">
              <ng-icon name="remixLiveLine"></ng-icon>
            </span>
            <span translate>digitalTwin.tab.overview</span>
          </a>
        </li>
        <li routerLinkActive="is-active">
          <a routerLink="history" queryParamsHandling="preserve">
            <span class="icon">
              <ng-icon name="remixLineChartLine"></ng-icon>
            </span>
            <span translate>digitalTwin.tab.history</span>
          </a>
        </li>
        <li routerLinkActive="is-active">
          <a routerLink="simulation" queryParamsHandling="preserve">
            <span class="icon">
              <ng-icon name="remixPlayCircleLine"></ng-icon>
            </span>
            <span translate>digitalTwin.tab.simulation</span>
          </a>
        </li>
        <li routerLinkActive="is-active">
          <a routerLink="control" queryParamsHandling="preserve">
          <span class="icon">
            <ng-icon name="remixGamepadLine"></ng-icon>
          </span>
          <span translate>digitalTwin.tab.control</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
  <div class="card-content p-0">
    <router-outlet></router-outlet>
  </div>
</div>
